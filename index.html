<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Adiantamento Interceptor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Crimson+Pro:wght@400;600&display=swap">
<style>
/* Layout: uma coluna central, mapa em destaque, painel de comandos abaixo; tema escuro dourado da Interceptor */
:root{--bg:#080806;--bg2:#0D0C08;--card:#131108;--line:#2a2412;--gold:#C9A84C;--gold2:#e6c76a;--text:#e9e2cc;--mute:#9a9276;--sec:#2fd36b;--ter:#3b8cff;--pri:#f2c230;--bad:#ff5a4d;--ok:#46d483;color-scheme:dark;
--display:'Cinzel',Georgia,serif;--body:'Crimson Pro',Georgia,serif}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:18px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 40px;min-height:100%}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:12px}
.brand small{display:block;font:600 11px var(--display);letter-spacing:.3em;color:var(--mute)}
.brand b{font:700 22px var(--display);letter-spacing:.12em;color:var(--gold)}
.hud{display:flex;gap:18px;font-variant-numeric:tabular-nums}
.hud div{text-align:right}
.hud span{display:block;font:600 10px var(--display);letter-spacing:.2em;color:var(--mute)}
.hud strong{font:700 20px var(--display);color:var(--text)}
.hud .err strong{color:var(--bad)}
h1,h2{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:.06em}
h2{font-size:20px;color:var(--gold)}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px}
.rules{display:grid;gap:10px;margin:12px 0 0;padding:0;list-style:none}
.rules li{display:flex;gap:12px;align-items:flex-start}
.dot{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:700 12px var(--display);color:#000}
.dot.p{background:var(--pri)}.dot.s{background:var(--sec)}.dot.t{background:var(--ter);color:#fff}.dot.x{background:var(--bad);color:#fff}
.btn{appearance:none;border:1px solid var(--gold);background:var(--gold);color:#120f05;font:700 14px var(--display);letter-spacing:.14em;padding:13px 20px;border-radius:4px;cursor:pointer;text-transform:uppercase}
.btn:hover{background:var(--gold2)}
.btn.ghost{background:transparent;color:var(--gold)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
.sit{display:flex;flex-direction:column;gap:4px}
.sit .tag{font:600 11px var(--display);letter-spacing:.25em;color:var(--mute)}
.sit p{margin:0}
.stage{margin:0 auto;width:100%}
.map{position:relative;line-height:0;border:1px solid var(--line);border-radius:4px;overflow:hidden;touch-action:manipulation;cursor:crosshair;user-select:none;-webkit-user-select:none}
.map img{width:100%;display:block;pointer-events:none}
.mk{position:absolute;transform:translate(-50%,-50%);width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:700 13px var(--display);color:#000;border:2px solid #fff;box-shadow:0 2px 8px #000a;line-height:1;pointer-events:none}
.mk.p{background:var(--pri)}.mk.s{background:var(--sec)}.mk.t{background:var(--ter);color:#fff}.mk.x{background:var(--bad);color:#fff;width:24px;height:24px;font-size:11px}
.mk.pulse{animation:pl 1.2s infinite}
@keyframes pl{50%{box-shadow:0 0 0 8px #c9a84c33}}
.zone{position:absolute;transform:translate(-50%,-50%);border-radius:50%;border:2px dashed;pointer-events:none;display:grid;place-items:center;font:700 11px var(--display);line-height:1.1;text-align:center;opacity:0;transition:opacity .5s}
.zone.show{opacity:1}
.zone.s{border-color:var(--sec);background:#2fd36b30;color:#bff5d3}
.zone.t{border-color:var(--ter);background:#3b8cff30;color:#cfe2ff}
.zone.ex{border-color:#e9e2cc99;background:#ffffff10;color:#e9e2ccaa;font-weight:600}
.cand{position:absolute;transform:translate(-50%,-50%);width:34px;height:34px;border-radius:50%;background:#0d0c08ee;border:2px solid var(--gold2);color:var(--gold2);display:grid;place-items:center;font:700 15px var(--display);line-height:1;cursor:pointer;padding:0;box-shadow:0 2px 8px #000a}
.cand:hover,.cand:focus-visible{background:var(--gold);color:#120f05}
.cand.right{background:var(--ok);border-color:#fff;color:#04140a}.cand.wrong{background:var(--bad);border-color:#fff;color:#fff}.cand.off{opacity:.55;cursor:default}
.zone.f{border-color:var(--bad);background:#ff5a4d28;color:#ffd2cd;border-style:solid}
.runner{transition:left 1.6s ease-in-out,top 1.6s ease-in-out}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.seg{display:flex;gap:8px;flex:1 1 260px}
.seg button{flex:1;appearance:none;background:var(--bg2);border:1px solid var(--line);color:var(--text);font:700 13px var(--display);letter-spacing:.08em;padding:11px 8px;border-radius:4px;cursor:pointer;display:flex;gap:8px;align-items:center;justify-content:center}
.seg button.on.s{border-color:var(--sec);background:#2fd36b1f}
.seg button.on.t{border-color:var(--ter);background:#3b8cff1f}
.seg button .dot{width:20px;height:20px;font-size:10px}
.fb{display:grid;gap:10px}
.fb .row{display:flex;gap:12px;align-items:flex-start;border-top:1px solid var(--line);padding-top:10px}
.fb .row:first-child{border-top:0;padding-top:0}
.pts{flex:none;min-width:58px;text-align:right;font:700 16px var(--display);font-variant-numeric:tabular-nums}
.pts.good{color:var(--ok)}.pts.bad{color:var(--bad)}.pts.mid{color:var(--pri)}
.verdict{font:700 16px var(--display);letter-spacing:.1em}
.verdict.ok{color:var(--ok)}.verdict.no{color:var(--bad)}
.tip{border-left:3px solid var(--gold);padding-left:12px;color:var(--text)}
.tip b{color:var(--gold)}
.rank{font:700 76px var(--display);color:var(--gold);line-height:1}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.sum div{background:var(--bg2);border:1px solid var(--line);border-radius:4px;padding:10px 12px}
.sum span{display:block;font:600 10px var(--display);letter-spacing:.2em;color:var(--mute)}
.sum strong{font:700 22px var(--display);font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:16px}
th,td{padding:6px 4px;text-align:left;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
th{font:600 10px var(--display);letter-spacing:.2em;color:var(--mute)}
.tw{overflow-x:auto}
footer{color:var(--mute);font-size:14px;text-align:center;margin-top:8px}
footer a{color:var(--gold)}
@media (prefers-reduced-motion:reduce){.mk.pulse{animation:none}.runner{transition:none}.zone{transition:none}}
</style>

function ang(v){return Math.atan2(v[1],v[0])*180/Math.PI}
function diff(a,b){var d=Math.abs(a-b)%360;return d>180?360-d:d}
function norm(v){var l=Math.hypot(v[0],v[1])||1;return[v[0]/l,v[1]/l]}
function geo(R,m){var S=R.path[m],N=R.path[m+1];var v=norm([N[0]-S[0],N[1]-S[1]]);return{S:S,v:v,h:ang(v),m:m}}
function at(g,k,side){var n=[-g.v[1],g.v[0]];side=side||0;return[g.S[0]-g.v[0]*k+n[0]*side,g.S[1]-g.v[1]*k+n[1]*side]}
function clamp(R,p){return[Math.max(20,Math.min(R.W-20,p[0])),Math.max(20,Math.min(R.H-20,p[1]))]}
function shuffle(a,rnd){for(var i=a.length-1;i>0;i--){var j=Math.floor(rnd()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
/* monta uma pergunta: {role, g, fixed:[{c,n,p}], cands:[{p,ok,why}]} */
function build(R,role,rnd){
 var m=(role==='s')?1:0,g=geo(R,m),c=[],fixed=[];
 if(role==='p'){
  c=[{p:at(g,52),ok:1,why:'Atrás do acompanhado, colada. Correto.'},
     {p:at(g,-66),ok:0,why:'À frente do acompanhado. A primária nunca passa dele.'},
     {p:at(g,52,64),ok:0,why:'Ao lado do eixo dele, fora da via. A primária segue no mesmo eixo.'},
     {p:at(g,165),ok:0,why:'Longe demais. A primária fica atrás dele a todo momento, colada.'}]}
 else if(role==='s'){
  fixed=[{c:'p',n:1,p:at(g,52)}];
  c=[{p:at(g,86),ok:1,why:'Colada atrás da primária, no mesmo eixo. Correto.'},
     {p:at(g,52,64),ok:0,why:'Ao lado da primária. A secundária fica colada atrás dela, no mesmo eixo.'},
     {p:at(g,170),ok:0,why:'Longe da primária. A secundária fica colada nela, as duas sempre juntas.'},
     {p:at(g,-66),ok:0,why:'À frente do acompanhado. A secundária fica colada atrás da primária.'}]}
 else{
  fixed=[{c:'p',n:1,p:at(g,52)},{c:'s',n:2,p:at(g,86)}];
  var ah=[],bh=[];
  R.exits.forEach(function(z){var a=diff(ang([z[0]-g.S[0],z[1]-g.S[1]]),g.h);if(dist(g.S,z)>60&&a<=110)ah.push(z);else bh.push(z)});
  shuffle(ah,rnd);
  c.push({p:[ah[0][0],ah[0][1]],ok:1,why:'Saída lateral à frente do acompanhado. Correto.'});
  if(ah[1])c.push({p:[ah[1][0],ah[1][1]],ok:1,why:'Também é saída lateral à frente. Serve.'});
  c.push({p:at(g,-66),ok:0,why:'Na frente do acompanhado, na própria via. Isso é bloqueio. Cerco é sempre parcial.'});
  if(bh.length)c.push({p:[bh[0][0],bh[0][1]],ok:0,why:'Saída que ele já passou. A terciária pega saída à frente.'});
  else c.push({p:at(g,150,50),ok:0,why:'Atrás do comboio. A terciária pega saída à frente do acompanhado.'});
  if(c.length<4)c.push({p:at(g,90,64),ok:0,why:'Junto ao comboio. A terciária usa uma saída lateral, não segue atrás.'})}
 c.forEach(function(x){x.p=clamp(R,x.p)});
 // afasta candidatos que ficam grudados
 for(var i=0;i<c.length;i++)for(var j=0;j<i;j++){var k=0;while(dist(c[i].p,c[j].p)<46&&k<10){c[i].p=clamp(R,[c[i].p[0]+20,c[i].p[1]+22]);k++}}
 shuffle(c,rnd);var L='ABCD';c.forEach(function(x,i){x.l=L[i]});
 return{role:role,g:g,fixed:fixed,cands:c}}
function hud(){document.getElementById('hud').hidden=!G;if(!G)return;
 document.getElementById('hR').textContent=Math.min(G.i+1,G.qs.length)+'/'+G.qs.length;
 document.getElementById('hP').textContent=G.pts;document.getElementById('hE').textContent=G.err}
function intro(){G=null;hud();var a=document.getElementById('app');a.innerHTML='';
 var c=el('section','card');
 c.innerHTML='<h2>Onde a viatura fica?</h2><p style="margin:8px 0 0">Em cada cenário o acompanhado está em fuga e o mapa mostra pontos marcados com letras. Para cada pergunta, toque no ponto onde a viatura pedida deve ficar.</p>'+
 '<ul class="rules"><li><span class="dot p">1</span><span><b>Primária</b></span></li><li><span class="dot s">2</span><span><b>Secundária</b></span></li><li><span class="dot t">3</span><span><b>Terciária</b></span></li>'+
 '<li><span class="dot x">!</span><span>Resposta errada tira 20 pontos e conta como erro. O botão de dica dá uma pista, sem a resposta, e reduz o ganho da pergunta. Acerto vale 50, ou 35 com dica.</span></li></ul>'+
 '<p style="color:var(--mute);margin:14px 0 0;font-size:16px">São 6 cenários com 3 perguntas cada. Depois de responder, você vê o motivo de cada ponto.</p>';
 var b=el('button','btn','Iniciar treino');b.style.marginTop='16px';b.onclick=start;c.appendChild(b);a.appendChild(c);
 var bs=best();if(bs){var p=el('p','','Melhor pontuação neste aparelho: <b style="color:var(--gold)">'+bs+'</b>');p.style.color='var(--mute)';a.appendChild(p)}}
function start(){var qs=[];ROUNDS.forEach(function(R,ri){['p','s','t'].forEach(function(r){qs.push({ri:ri,role:r})})});
 G={i:0,pts:0,err:0,hints:0,okc:0,log:[],qs:qs};hud();ask()}
function px(R,x){return x/R.W*100}function py(R,y){return y/R.H*100}
function mk(R,cls,x,y,txt){var m=el('div','mk '+cls,txt);m.style.left=px(R,x)+'%';m.style.top=py(R,y)+'%';return m}
function arrow(m,h){var s=el('span','','');s.style.cssText='position:absolute;left:50%;top:50%;width:0;height:0;transform:translate(-50%,-50%) rotate('+(h+90)+'deg);pointer-events:none';
 var i=el('span','','');i.style.cssText='position:absolute;left:19px;top:-7px;border-left:12px solid var(--bad);border-top:7px solid transparent;border-bottom:7px solid transparent;filter:drop-shadow(0 1px 2px #000)';s.appendChild(i);m.appendChild(s)}
function rnd(){return Math.random()}
function ask(){
 var q=G.qs[G.i],R=ROUNDS[q.ri],role=ROLE[q.role],a=document.getElementById('app');a.innerHTML='';hud();
 var Q=build(R,q.role,rnd);G.cur=Q;
 a.appendChild(el('section','card sit','<span class="tag">CENÁRIO '+(q.ri+1)+' · '+R.n.toUpperCase()+'</span><p>'+R.sit+'</p><h2 style="margin-top:6px">Onde a <span style="color:var(--text)">'+role.n+'</span> fica?</h2>'));
 var stage=el('div','stage');stage.style.maxWidth=Math.min(680,Math.round(Math.max(300,innerHeight*.74)*R.W/R.H))+'px';
 var map=el('div','map');map.style.cursor='default';var img=new Image();img.src=MAPS[R.img];img.alt='Mapa aéreo do cenário '+(q.ri+1);map.appendChild(img);
 var sus=mk(R,'x',Q.g.S[0],Q.g.S[1],'AC');sus.style.width='32px';sus.style.height='32px';sus.style.fontSize='10px';arrow(sus,Q.g.h);map.appendChild(sus);
 Q.fixed.forEach(function(f){map.appendChild(mk(R,f.c,f.p[0],f.p[1],String(f.n)))});
 var btns=[];
 Q.cands.forEach(function(c){var b=el('button','cand',c.l);b.style.left=px(R,c.p[0])+'%';b.style.top=py(R,c.p[1])+'%';b.setAttribute('aria-label','Ponto '+c.l);b.onclick=function(){answer(c,btns,Q,R,a,hintUsed.v)};btns.push(b);map.appendChild(b)});
 stage.appendChild(map);a.appendChild(stage);
 var hintUsed={v:false};
 var bar=el('div','toolbar');var hb=el('button','btn ghost','Preciso de uma dica');
 var ht=el('p','tip','');ht.hidden=true;
 hb.onclick=function(){if(!hintUsed.v){hintUsed.v=true;G.hints++;ht.innerHTML='<b>Dica.</b> '+role.hint.replace('Dica: ','');ht.hidden=false;hb.disabled=true;hb.textContent='Dica usada (acerto vale 35)'}};
 bar.appendChild(hb);a.appendChild(bar);a.appendChild(ht);
 a.appendChild(el('p','','Toque na letra do ponto escolhido. Legenda: AC = acompanhado (a seta mostra o rumo), números = viaturas já posicionadas.')).style.cssText='margin:0;color:var(--mute);font-size:15px';
 G.bar=bar;G.ht=ht;
}
function answer(c,btns,Q,R,a,hinted){
 if(G.done===G.i)return;G.done=G.i;
 var role=ROLE[Q.role],gain=c.ok?(hinted?PTS.okHint:PTS.ok):PTS.bad;
 G.pts=Math.max(0,G.pts+gain);if(!c.ok)G.err++;else G.okc++;hud();
 btns.forEach(function(b,i){b.disabled=true;var k=Q.cands[i];b.classList.add('off');b.classList.add(k.ok?'right':(k===c?'wrong':'off'))});
 G.bar.remove();G.ht.remove();
 var card=el('section','card fb');
 card.appendChild(el('div','verdict '+(c.ok?'ok':'no'),c.ok?'CERTO':'ERRADO · 1 ERRO'));
 var row=el('div','row');row.innerHTML='<span class="dot '+role.c+'">'+role.num+'</span><div style="flex:1;min-width:0"><b>Ponto '+c.l+'</b><br><span style="color:var(--mute);font-size:16px">'+c.why+'</span></div><span class="pts '+(gain>0?'good':'bad')+'">'+(gain>0?'+':'')+gain+'</span>';card.appendChild(row);
 var others=Q.cands.filter(function(k){return k!==c}).map(function(k){return'<b>'+k.l+'</b>: '+k.why}).join('<br>');
 card.appendChild(el('div','row','<div style="color:var(--mute);font-size:16px">'+others+'</div>'));
 a.appendChild(card);
 a.appendChild(el('div','card tip','<b>Pelo manual.</b> '+role.why));
 G.log.push({n:R.n,r:role.n,ok:c.ok,h:hinted});
 var last=G.i>=G.qs.length-1;var nb=el('button','btn',last?'Ver resultado':'Próxima pergunta');
 nb.onclick=function(){G.i++;last?final():ask();window.scrollTo&&window.scrollTo(0,0)};a.appendChild(nb);
 setTimeout(function(){card.scrollIntoView&&card.scrollIntoView({behavior:'smooth',block:'nearest'})},300)}
function final(){
 var a=document.getElementById('app');a.innerHTML='';hud();
 var max=G.qs.length*PTS.ok,p=G.pts,rk=p>=max*.85?'S':p>=max*.7?'A':p>=max*.5?'B':'C';
 var msg={S:'Posicionamento de elite. Você conhece a função de cada viatura.',A:'Muito bom. Poucos ajustes e fica perfeito.',B:'Razoável. Revise: primária atrás do acompanhado, secundária colada na primária e só a terciária faz o cerco.',C:'Refaça o treino e releia as regras de cada função.'}[rk];
 saveBest(p);
 var c=el('section','card');c.innerHTML='<div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap"><div class="rank">'+rk+'</div><div style="flex:1;min-width:200px"><h2>Treino concluído</h2><p style="margin:4px 0 0">'+msg+'</p></div></div>'+
  '<div class="sum" style="margin-top:14px"><div><span>PONTOS</span><strong>'+p+'</strong></div><div><span>ACERTOS</span><strong>'+G.okc+'/'+G.qs.length+'</strong></div><div><span>ERROS</span><strong style="color:var(--bad)">'+G.err+'</strong></div><div><span>DICAS</span><strong>'+G.hints+'</strong></div><div><span>MELHOR</span><strong>'+best()+'</strong></div></div>';
 var rows=G.log.map(function(l,i){return'<tr><td>'+(i+1)+'</td><td>'+l.n+'</td><td>'+l.r+'</td><td>'+(l.ok?'Certo':'Errado')+(l.h?' (dica)':'')+'</td></tr>'}).join('');
 var tw=el('div','tw','<table><thead><tr><th>#</th><th>CENÁRIO</th><th>VIATURA</th><th>RESULTADO</th></tr></thead><tbody>'+rows+'</tbody></table>');tw.style.marginTop='14px';c.appendChild(tw);
 a.appendChild(c);var b=el('button','btn','Jogar de novo');b.onclick=start;a.appendChild(b)}
window.__adv_test={build:build,ROUNDS:ROUNDS,start:start};
intro();
</script>

</body></html>
